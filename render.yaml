services:
  - type: web
    name: wavelength-podcast
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: wavelength-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: REC_DIR
        value: /var/data/recordings
