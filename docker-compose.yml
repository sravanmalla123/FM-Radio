version: '3.8'

services:
  wavelength:
    build: .
    container_name: wavelength_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - wavelength_data:/app/data
      - wavelength_recordings:/app/recordings
    restart: unless-stopped

volumes:
  wavelength_data:
  wavelength_recordings:
